<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fond carré arrondi indigo -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#6366f1"/>

  <!-- Anneau externe -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6"/>

  <!-- Nœuds neuronaux (6 points sur le cercle, r=196) -->
  <!-- top -->        <circle cx="256" cy="60"  r="16" fill="white"/>
  <!-- top-right --> <circle cx="426" cy="158" r="14" fill="rgba(255,255,255,0.65)"/>
  <!-- bot-right --> <circle cx="426" cy="354" r="14" fill="rgba(255,255,255,0.65)"/>
  <!-- bottom -->    <circle cx="256" cy="452" r="16" fill="white"/>
  <!-- bot-left -->  <circle cx="86"  cy="354" r="14" fill="rgba(255,255,255,0.65)"/>
  <!-- top-left -->  <circle cx="86"  cy="158" r="14" fill="rgba(255,255,255,0.65)"/>

  <!-- Connexions (lignes entre nœuds adjacents) -->
  <line x1="256" y1="60"  x2="426" y2="158" stroke="rgba(255,255,255,0.30)" stroke-width="3"/>
  <line x1="426" y1="158" x2="426" y2="354" stroke="rgba(255,255,255,0.30)" stroke-width="3"/>
  <line x1="426" y1="354" x2="256" y2="452" stroke="rgba(255,255,255,0.30)" stroke-width="3"/>
  <line x1="256" y1="452" x2="86"  y2="354" stroke="rgba(255,255,255,0.30)" stroke-width="3"/>
  <line x1="86"  y1="354" x2="86"  y2="158" stroke="rgba(255,255,255,0.30)" stroke-width="3"/>
  <line x1="86"  y1="158" x2="256" y2="60"  stroke="rgba(255,255,255,0.30)" stroke-width="3"/>

  <!-- Monogramme SC -->
  <text
    x="256" y="310"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Consolas', monospace"
    font-weight="800"
    font-size="168"
    fill="white"
    letter-spacing="-6"
  >SC</text>
</svg>
